; TaskFlow conformance + E2E suite.
;
; Run one phase against one implementation:      pytest -m phase1 --impl go
; Run one phase against all five:                pytest -m phase1
; Run everything that should pass on day one:    pytest -m phase0
;
; --strict-markers is deliberate: a typo'd marker (`-m phase11` vs `-m phase1`
; is easy, `@pytest.mark.phse4` is easier) must be an error, not a silent
; "0 tests selected, everything is fine".

[pytest]
testpaths = conformance e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --strict-config
    -ra
    --tb=short
    --durations=10
    --color=yes

; A hung implementation must fail the phase, not the CI job's wall clock.
; Individual slow tests raise this with @pytest.mark.timeout(...).
timeout = 120
timeout_method = thread

markers =
    phase0: Phase 0 — Scaffold. Envelope and health probes; passes against the shipped skeleton.
    phase1: Phase 1 — Core API. Auth, task CRUD, pagination, filtering, sorting, ownership isolation.
    phase2: Phase 2 — Observability. Traces, metrics, structured logs, identical histogram buckets, SLOs.
    phase3: Phase 3 — Database Depth. Indexes, query plans, N+1, transactions, concurrency.
    phase4: Phase 4 — Caching & Rate Limiting. Valkey cache, invalidation, distributed GCRA rate limits.
    phase5: Phase 5 — Resilience. Idempotency, body limits, timeouts, breakers, graceful shutdown.
    phase6: Phase 6 — Events & the Outbox. Transactional outbox over Valkey Streams, exactly-once processing.
    phase7: Phase 7 — Security Hardening. Security headers, token rotation, timing-safe auth.
    phase8: Phase 8 — Load Testing & Profiling. Verified by tooling output (make bench / soak / profile), not assertions.
    phase9: Phase 9 — Real-Time at Scale. WebSocket fan-out, backpressure.
    phase10: Phase 10 — Object Storage. Multipart and presigned attachment flows.
    phase11: Phase 11 — Synthesis. Write-up and benchmark report; no automated tests.
    differential: Cross-implementation differential comparison; requires --impl all.
    appendix: Optional extension material, not part of any phase. Skipped unless you opt in (Kafka parity: -m appendix --kafka-brokers localhost:9092).
    slow: Takes more than ~10s. Deselect with -m "not slow".
    docker: Needs the Docker CLI and the compose stack (signals, env inspection).
    e2e: Full user journey rather than a single endpoint.
    destructive: Mutates shared infrastructure state; do not run against anything you care about.

filterwarnings =
    default
    ignore::DeprecationWarning:kafka.*
