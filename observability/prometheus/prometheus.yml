global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { cluster: taskflow-dev }

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]

  # The collector is a single point of failure for ALL telemetry.
  # A silently-dropping collector is worse than no collector, because you
  # will trust the empty dashboard. Alert on this job.
  - job_name: otel-collector
    static_configs: [{ targets: ['otel-collector:8890'] }]

  # Fallback scrape path, for before you wire up OTLP push in Phase 2.
  # Harmless if the services don't expose /metrics yet — the targets just
  # show as down.
  - job_name: taskflow-services
    metrics_path: /metrics
    static_configs:
      - targets: ['go-api:8080']
        labels: { service_name: taskflow-go,         language: go }
      - targets: ['rust-api:8080']
        labels: { service_name: taskflow-rust,       language: rust }
      - targets: ['python-api:8080']
        labels: { service_name: taskflow-python,     language: python }
      - targets: ['csharp-api:8080']
        labels: { service_name: taskflow-csharp,     language: csharp }
      - targets: ['typescript-api:8080']
        labels: { service_name: taskflow-typescript, language: typescript }
