server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
ingester:
  max_block_duration: 5m
compactor:
  compaction: { block_retention: 168h }
storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }
# Generates RED metrics from spans — gives you a service graph in Grafana
# without instrumenting anything extra.
metrics_generator:
  registry:
    external_labels: { source: tempo }
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage: { path: /var/tempo/generator/traces }
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
