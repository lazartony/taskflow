openapi: 3.1.0

info:
  title: TaskFlow API
  version: 1.0.0
  summary: RESTful task-management API implemented identically in five languages.
  description: |
    # TaskFlow API

    Normative API contract for the TaskFlow task-management system (constraint **C12** —
    `docs/openapi.yaml` is the contract; no implementation defines it).

    Five independent implementations (Go, Rust, Python, C#, TypeScript) must satisfy this
    document byte-for-byte in response shape. Conformance is verified with
    **Schemathesis 4.x** (`--checks all`) plus a differential test that diffs the five
    responses against each other.

    ## Base path

    All endpoints are served under `/api/v1`.

    ## Authentication

    Every endpoint except `POST /auth/register`, `POST /auth/login` and the four
    `/health*` endpoints requires a JWT bearer token:

    ```
    Authorization: Bearer <access_token>
    ```

    ## Response envelope

    Every response — success or failure — is an envelope.

    Success:

    ```json
    {
      "success": true,
      "data": { },
      "meta": {
        "requestId": "req_abc123xyz",
        "timestamp": "2026-08-07T12:34:56.789Z",
        "traceId": "4bf92f3577b34da6a3ce929d0e0e4736"
      }
    }
    ```

    Error:

    ```json
    {
      "success": false,
      "error": { "code": "VALIDATION_ERROR", "message": "...", "details": { } },
      "meta": { "requestId": "...", "timestamp": "...", "traceId": "..." }
    }
    ```

    List endpoints add a sibling `pagination` object.

    `meta.traceId` is the W3C trace ID (32 lowercase hex, no prefix) added by **OBS4.7**;
    `meta.requestId` keeps its `req_` prefix and remains the human-quotable support
    identifier. Both are required on every response.

    ## Health endpoints (OBS5)

    | Endpoint | Purpose | Dependency checks |
    |---|---|---|
    | `GET /health/live` | liveness — is the process wedged | none |
    | `GET /health/ready` | readiness — should this replica get traffic | database, cache, broker |
    | `GET /health/startup` | startup — migrations applied, pools warm | migrations only |
    | `GET /health` | backwards-compatible alias of `/health/ready` (OBS5.5) | database, cache, broker |

    Readiness results are cached for 1s with a hard 2s timeout (OBS5.4).

    ## Real-time updates (not modelled here)

    `GET /api/v1/ws/events?token=<access_token>` is a **WebSocket** endpoint and is
    deliberately absent from `paths` — OpenAPI cannot describe a bidirectional message
    stream, and a stub entry would make Schemathesis attempt a plain HTTP GET against it
    and report a spurious failure. Its contract is recorded under the root-level
    `x-websocket` extension of this document instead.

    ## Idempotency (FR8)

    `POST /tasks` and `POST /auth/register` accept an optional `Idempotency-Key` header.
    A replay within 24h returns the original response with `Idempotency-Replayed: true`.
    A key that is currently in flight returns `409 CONFLICT`.

    ## Rate limiting

    | Endpoint group | Limit |
    |---|---|
    | `/auth/*` | 10 requests/minute |
    | `/tasks/*` | 100 requests/minute |

    Limits are enforced in shared state (Valkey), not per-process. All rate-limited
    responses carry `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset`;
    `429` responses additionally carry `Retry-After`.
  contact:
    name: TaskFlow Engineering
    url: https://github.com/lazartony/taskflow
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8001/api/v1
    description: Go implementation
  - url: http://localhost:8002/api/v1
    description: Rust implementation
  - url: http://localhost:8003/api/v1
    description: Python implementation
  - url: http://localhost:8004/api/v1
    description: C# implementation
  - url: http://localhost:8005/api/v1
    description: TypeScript implementation

tags:
  - name: Authentication
    description: Registration, login, token lifecycle and profile management.
  - name: Tasks
    description: Task CRUD, filtering, sorting and pagination.
  - name: Attachments
    description: Multipart and presigned-URL file attachment flows.
  - name: System
    description: Liveness, readiness and startup probes.

security:
  - bearerAuth: []

x-websocket:
  path: /api/v1/ws/events
  protocol: ws
  description: |
    Real-time task and attachment events. Not expressible in OpenAPI; documented here so
    the contract stays in one file. Rate limit: 5 concurrent connections per user.
  connectionUrl: ws://localhost:8001/api/v1/ws/events?token=<access_token>
  queryParameters:
    token:
      type: string
      required: true
      description: JWT access token. Passed as a query parameter because browsers cannot set headers on WebSocket handshakes.
  clientMessages:
    subscribe:
      example:
        type: subscribe
        taskId: tsk_abc123
  serverMessages:
    example:
      type: task.created
      data:
        id: tsk_abc123
        title: New task
        status: pending
        createdAt: '2026-08-07T12:34:56.789Z'
      timestamp: '2026-08-07T12:34:56.789Z'
  eventTypes:
    - task.created
    - task.updated
    - task.deleted
    - attachment.added
    - attachment.removed

paths:

  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------

  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register a new user account
      description: |
        Creates a user and immediately issues an access/refresh token pair.
        Accepts an optional `Idempotency-Key` header (FR8.1).
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                summary: New account
                value:
                  email: user@example.com
                  password: SecurePass123
                  displayName: John Doe
      responses:
        '201':
          description: Account created.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
            traceresponse: { $ref: '#/components/headers/Traceresponse' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      user:
                        id: usr_abc123
                        email: user@example.com
                        displayName: John Doe
                        avatarUrl: null
                        createdAt: '2026-08-07T12:34:56.789Z'
                        updatedAt: '2026-08-07T12:34:56.789Z'
                      tokens:
                        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfYWJjMTIzIn0.sig
                        refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfYWJjMTIzIn0.rsig
                        expiresIn: 900
                    meta:
                      requestId: req_abc123xyz
                      timestamp: '2026-08-07T12:34:56.789Z'
                      traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceOverloaded' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Authenticate and receive tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: test@example.com
                  password: TestPass123
      responses:
        '200':
          description: Authenticated.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
            traceresponse: { $ref: '#/components/headers/Traceresponse' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      user:
                        id: usr_abc123
                        email: test@example.com
                        displayName: John Doe
                        avatarUrl: null
                        createdAt: '2026-08-01T10:00:00.000Z'
                        updatedAt: '2026-08-05T14:30:00.000Z'
                      tokens:
                        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfYWJjMTIzIn0.sig
                        refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfYWJjMTIzIn0.rsig
                        expiresIn: 900
                    meta:
                      requestId: req_abc123xyz
                      timestamp: '2026-08-07T12:34:56.789Z'
                      traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceOverloaded' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshTokens
      summary: Exchange a refresh token for a new token pair
      description: |
        Rotates the refresh token. The presented refresh token is revoked on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              default:
                value:
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfYWJjMTIzIn0.rsig
      responses:
        '200':
          description: New token pair issued.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
            traceresponse: { $ref: '#/components/headers/Traceresponse' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      tokens:
                        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfYWJjMTIzIn0.sig2
                        refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfYWJjMTIzIn0.rsig2
                        expiresIn: 900
                    meta:
                      requestId: req_abc123xyz
                      timestamp: '2026-08-07T12:34:56.789Z'
                      traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceOverloaded' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutUser
      summary: Revoke a refresh token and end the session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            examples:
              default:
                value:
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfYWJjMTIzIn0.rsig
      responses:
        '200':
          description: Logged out.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
            traceresponse: { $ref: '#/components/headers/Traceresponse' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      message: Successfully logged out
                    meta:
                      requestId: req_abc123xyz
                      timestamp: '2026-08-07T12:34:56.789Z'
                      traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceOverloaded' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: Current user.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
            traceresponse: { $ref: '#/components/headers/Traceresponse' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      user:
                        id: usr_abc123
                        email: user@example.com
                        displayName: John Doe
                        avatarUrl: https://example.com/avatar.jpg
                        createdAt: '2026-08-07T12:34:56.789Z'
                        updatedAt: '2026-08-07T12:34:56.789Z'
                    meta:
                      requestId: req_abc123xyz
                      timestamp: '2026-08-07T12:34:56.789Z'
                      traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceOverloaded' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /auth/profile:
    put:
      tags: [Authentication]
      operationId: updateProfile
      summary: Update the authenticated user's profile
      description: All fields are optional; at least one must be supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            examples:
              default:
                value:
                  displayName: John Updated
                  avatarUrl: https://example.com/new-avatar.jpg
      responses:
        '200':
          description: Profile updated.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
            traceresponse: { $ref: '#/components/headers/Traceresponse' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      user:
                        id: usr_abc123
                        email: user@example.com
                        displayName: John Updated
                        avatarUrl: https://example.com/new-avatar.jpg
                        createdAt: '2026-08-01T10:00:00.000Z'
                        updatedAt: '2026-08-07T12:34:56.789Z'
                    meta:
                      requestId: req_abc123xyz
                      timestamp: '2026-08-07T12:34:56.789Z'
                      traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceOverloaded' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  # ---------------------------------------------------------------------------
  # Tasks
  # ---------------------------------------------------------------------------

  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List the authenticated user's tasks
      description: |
        Paginated, filterable and sortable. `sortBy` and `sortOrder` are allow-listed
        enums, never interpolated into SQL (SEC3.3).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/StatusFilterParam'
        - $ref: '#/components/parameters/PriorityFilterParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/DueDateFromParam'
        - $ref: '#/components/parameters/DueDateToParam'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
      responses:
        '200':
          description: A page of tasks.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
            traceresponse: { $ref: '#/components/headers/Traceresponse' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      - id: tsk_abc123
                        title: Complete project documentation
                        description: Write comprehensive API documentation
                        status: in_progress
                        priority: high
                        dueDate: '2026-08-15T00:00:00.000Z'
                        completedAt: null
                        createdAt: '2026-08-01T10:00:00.000Z'
                        updatedAt: '2026-08-05T14:30:00.000Z'
                    pagination:
                      page: 1
                      pageSize: 20
                      totalItems: 45
                      totalPages: 3
                      hasNext: true
                      hasPrev: false
                    meta:
                      requestId: req_abc123xyz
                      timestamp: '2026-08-07T12:34:56.789Z'
                      traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceOverloaded' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      description: Accepts an optional `Idempotency-Key` header (FR8.1).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            examples:
              default:
                value:
                  title: Complete project documentation
                  description: Write comprehensive API documentation
                  status: pending
                  priority: high
                  dueDate: '2026-08-15T00:00:00.000Z'
              minimal:
                summary: Title only — status and priority default
                value:
                  title: Buy milk
      responses:
        '201':
          description: Task created.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
            traceresponse: { $ref: '#/components/headers/Traceresponse' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      task:
                        id: tsk_abc123
                        title: Complete project documentation
                        description: Write comprehensive API documentation
                        status: pending
                        priority: high
                        dueDate: '2026-08-15T00:00:00.000Z'
                        completedAt: null
                        createdAt: '2026-08-07T12:34:56.789Z'
                        updatedAt: '2026-08-07T12:34:56.789Z'
                    meta:
                      requestId: req_abc123xyz
                      timestamp: '2026-08-07T12:34:56.789Z'
                      traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceOverloaded' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskIdPathParam'
    get:
      tags: [Tasks]
      operationId: getTaskById
      summary: Get a single task
      responses:
        '200':
          description: The task.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
            traceresponse: { $ref: '#/components/headers/Traceresponse' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      task:
                        id: tsk_abc123
                        title: Complete project documentation
                        description: Write comprehensive API documentation
                        status: in_progress
                        priority: high
                        dueDate: '2026-08-15T00:00:00.000Z'
                        completedAt: null
                        createdAt: '2026-08-01T10:00:00.000Z'
                        updatedAt: '2026-08-05T14:30:00.000Z'
                    meta:
                      requestId: req_abc123xyz
                      timestamp: '2026-08-07T12:34:56.789Z'
                      traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
