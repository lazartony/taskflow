  /tasks/{taskId}/attachments/presign:
    parameters:
      - $ref: '#/components/parameters/TaskIdOwnerPathParam'
    post:
      tags: [Attachments]
      operationId: presignAttachmentUpload
      summary: Request a presigned PUT URL for an attachment (FR9.1)
      description: |
        Authorises the caller against the task, generates an unguessable object key
        (`attachments/{task_id}/{uuid}/{filename}`, INF3.4) and returns a presigned PUT
        URL valid for 15 minutes. The bytes never transit the API process.
        Call `POST /tasks/{taskId}/attachments/complete` afterwards to create the row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
            examples:
              default:
                value:
                  fileName: document.pdf
                  fileSize: 1024000
                  mimeType: application/pdf
      responses:
        '200':
          description: Presigned upload issued.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
            traceresponse: { $ref: '#/components/headers/Traceresponse' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      upload:
                        uploadId: upl_abc123
                        url: https://storage.example.com/taskflow/attachments/tsk_abc123/6f0e5a6c-2e3b-4c7a-9f1e-0b2d3c4e5f60/document.pdf?X-Amz-Signature=abc
                        method: PUT
                        headers:
                          Content-Type: application/pdf
                        objectKey: attachments/tsk_abc123/6f0e5a6c-2e3b-4c7a-9f1e-0b2d3c4e5f60/document.pdf
                        expiresIn: 900
                        expiresAt: '2026-08-07T12:49:56.789Z'
                    meta:
                      requestId: req_abc123xyz
                      timestamp: '2026-08-07T12:34:56.789Z'
                      traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceOverloaded' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /tasks/{taskId}/attachments/complete:
    parameters:
      - $ref: '#/components/parameters/TaskIdOwnerPathParam'
    post:
      tags: [Attachments]
      operationId: completeAttachmentUpload
      summary: Finalise a presigned upload (FR9.2)
      description: |
        HEADs the uploaded object to confirm it exists and matches the declared size,
        then inserts the `attachments` row. Returns `404 NOT_FOUND` when the object is
        absent (the client never completed its PUT) and `409 CONFLICT` when the upload
        has already been completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
            examples:
              default:
                value:
                  uploadId: upl_abc123
                  fileName: document.pdf
                  fileSize: 1024000
                  mimeType: application/pdf
      responses:
        '201':
          description: Attachment created from the uploaded object.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
            traceresponse: { $ref: '#/components/headers/Traceresponse' }
          content:
            application/json:
              schema:
